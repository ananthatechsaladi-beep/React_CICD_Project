name: React Vite CI/CD

on:
  push:
    branches:
      - develop

jobs:

  # =====================
  # CI - BUILD
  # =====================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build


  # =====================
  # CD - DEVELOPMENT
  # =====================
  deploy-dev:
    needs: build

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/develop'

    environment: development

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Dev S3
        run: |
          aws s3 sync ./dist s3://${{ vars.S3_BUCKET }} --delete